# Refresca access_token (Microsoft) y lo sube a Supabase public.token.
# No requiere llegar a qrolvidocredencial.uade.edu.ar.
#
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
# El refresh vive en Supabase (public.token.refresh_token). Sembrá una vez desde la PC:
#   python main.py --login && python main.py
# Opcional si el refresh en Supabase vence del todo:
#   UADE_USERNAME
#   UADE_PASSWORD

name: UADE token → Supabase

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [run]
  schedule:
    - cron: '1 * * * *'

permissions:
  contents: read

jobs:
  vps-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: uade-token-supabase
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: python main.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UADE_USERNAME: ${{ secrets.UADE_USERNAME }}
          UADE_PASSWORD: ${{ secrets.UADE_PASSWORD }}
        run: python main.py
