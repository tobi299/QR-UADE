# Ejecuta main.py (sync codigoHash → Supabase) cada hora.
# Los horarios de cron usan UTC: "0 * * * *" = minuto 0 de cada hora UTC.
name: Sync UADE codigoHash

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: Sync
        run: python main.py
        env:
          UADE_USERNAME: ${{ secrets.UADE_USERNAME }}
          UADE_PASSWORD: ${{ secrets.UADE_PASSWORD }}
          UADE_REFRESH_TOKEN: ${{ secrets.UADE_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
